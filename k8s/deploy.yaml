apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: naval-combat-online
  name: naval-combat-online
  namespace: apps
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: naval-combat-online
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: naval-combat-online
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - image: ghcr.io/jati251/naval-combat-online:latest
        imagePullPolicy: Always
        name: naval-combat-online
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: naval-combat-online
  name: naval-combat-online
  namespace: apps
spec:
  ports:
  - name: http-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: naval-combat-online
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "naval-combat-online"
  name: naval-combat-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - naval-combat.cekcok.my.id
      secretName: naval-combat-tls
  rules:
  - host: naval-combat.cekcok.my.id
    http:
      paths:
      - backend:
          service:
            name: naval-combat-online
            port:
              number: 3000
        path: /
        pathType: Prefix
